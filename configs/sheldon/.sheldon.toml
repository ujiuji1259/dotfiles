shell = "zsh"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
apply = ["source"]

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins.compinit]
inline = 'autoload -Uz compinit && zsh-defer compinit'

[plugins.zsh-syntax-highlighting]
github = "zdharma/fast-syntax-highlighting"
apply = ["defer"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["defer"]

[plugins.autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

[plugins.history-fzf]
inline = '''
function fzf-select-history() {
    BUFFER=$(history -n -r 1 | fzf --query "$LBUFFER" --reverse)
    CURSOR=$#BUFFER
    zle reset-prompt
}
zle -N fzf-select-history
'''

[plugins.ghq]
inline = '''
repo-select() {
  local root="$(ghq root)"
  {
    ghq list | sed "s|^|$root/|"
    # 各リポジトリの .git/worktrees に登録されている worktree (claude の worktree も
    # git worktree add で作った標準のものもまとめて拾う。ghq ツリー外に置いた worktree も含む)
    ghq list -p | while IFS= read -r repo; do
      [ -d "$repo/.git/worktrees" ] || continue
      git -C "$repo" worktree list --porcelain 2>/dev/null | sed -n 's/^worktree //p'
    done
  } | awk '!seen[$0]++' | fzf
}
repo() {
  local dir
  dir=$(repo-select) || return
  [ -z "$dir" ] && return
  if command -v tmux >/dev/null 2>&1; then
    local session="$(basename "$dir" | tr '.' '_')"
    tmux has-session -t="$session" 2>/dev/null || tmux new-session -d -s "$session" -c "$dir"
    if [ -n "$TMUX" ]; then
      tmux switch-client -t="$session"
    else
      tmux attach-session -t="$session"
    fi
  else
    cd "$dir"
  fi
}
repo-widget() {
  local dir
  dir=$(repo-select < /dev/tty)
  if [ -z "$dir" ]; then
    zle reset-prompt
    return
  fi
  if command -v tmux >/dev/null 2>&1; then
    local session="$(basename "$dir" | tr '.' '_')"
    if [ -n "$TMUX" ]; then
      tmux has-session -t="$session" 2>/dev/null || tmux new-session -d -s "$session" -c "$dir"
      tmux switch-client -t="$session"
      zle reset-prompt
    else
      # widget 内から tmux attach は tty を奪えないので、BUFFER 経由でプロンプトに渡して実行する
      BUFFER="tmux has-session -t=\"$session\" 2>/dev/null || tmux new-session -d -s \"$session\" -c \"$dir\"; tmux attach-session -t=\"$session\""
      zle accept-line
    fi
  else
    BUFFER="cd \"$dir\""
    zle accept-line
  fi
}
zle -N repo-widget
'''

[plugins.bindings]
inline = '''
bindkey '^r' fzf-select-history
bindkey '^f' repo-widget
'''
